compute:
  input: data/input/pglib_opf_case30_ieee.m
  slack_bus: 0

  # How we choose active-power dispatch for the base regime:
  # - case   : use injections as provided in the case (NO OPF)
  # - dc_opf : run DC OPF (PyPSA+HiGHS) to get dispatch, then run AC PF
  #
  # Note:
  # Even with base_dispatch=dc_opf, the AC certificate is still built around AC PF.
  base_dispatch: case

  # ---- DC radii ----
  dc:
    compute: true

    # DC Gaussian std (MW) used by DC Monte Carlo / report verification
    # (results.__meta__.dc.inj_std_mw, unless overridden in verification).
    inj_std_mw: 1.0

    # Optional DC extensions (probabilistic + N-1) were moved out of AC-focused defaults
    # into `conf/config_dc_extensions.yaml`.
    #
    # Rationale:
    # - keep default config compact for AC Stability Radius workflow
    # - advanced DC post-processing remains available via CLI flags or by extending config

  # ---- AC radii ----
  ac:
    compute: true

    # AC PF base point + AC L2 certificate options.
    chunk_size: 256
    balance: true

    # AC PF initialization strategy:
    # - flat : flat start
    # - dc   : use DC-theta as initial angles (deterministic)
    # - pp   : compute pandapower PF first and use it as an explicit initial guess
    #
    # NOTE (soundness):
    # init=pp is NOT a solver fallback. If you request solver=pypsa and PyPSA PF fails,
    # the run fails fast (no implicit solver switching).
    pf_init: flat  # flat | dc | pp

    # ---- AC sigma-radius / metric-radius extensions ----
    # These are disabled by default; enable via CLI flags or experiment config.
    sigma:
      # Source for per-bus injection std deviations:
      # - ""        : disabled (no sigma/metric radii computed)
      # - "uniform" : broadcast scalar values to all buses
      # - "uc_jl"   : use per-bus arrays loaded from UnitCommitment.jl data
      sigma_p_mw_source: ""
      sigma_q_mvar_source: ""

      # Scalar values used when source = "uniform":
      sigma_p_mw_uniform: 1.0
      sigma_q_mvar_uniform: 1.0

    metric:
      # When enabled AND sigma arrays are available, also compute metric-radius
      # with M = diag(1/sigma^2) as a cross-check against sigma-radius.
      enabled: false

    # Save full h-vectors (adjoint sensitivities) to .npz alongside results.json.
    save_h_vectors: false

    # ---- Nonlinear AC replay validation ----
    # Disabled by default because it runs additional pandapower PF solves.
    # When enabled, compute replays worst-case directions for the top-k smallest
    # finite AC L2 radii and writes validation_report.json/md.
    validation:
      nonlinear:
        enabled: false
        top_k: 20
        scale_max: 5.0
        tol: 0.01
        max_iter: 20

  # ---- Outputs ----
  output:
    export_results: ""
    save_csv: true
    max_rows: null

    # Comma-separated; empty -> sectioned table defaults from `table.*`
    table_columns: ""
