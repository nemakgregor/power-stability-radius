# Main config entrypoint (Hydra/OmegaConf-style).
#
# This file is intentionally SMALL.
# It composes:
# - shared defaults (io/logging/opf/dc/tolerances/table)
# - compute defaults
# - monte-carlo defaults
# - report defaults
#
# Rationale:
# - easier to understand and maintain
# - each command config contains only relevant params
#
# CLI flags override these values.

extends:
  - ./config_shared.yaml
  - ./config_compute.yaml
  - ./config_monte_carlo.yaml
  - ./config_report.yaml