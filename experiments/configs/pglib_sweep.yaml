# Experiment 1 config: DC vs AC radius sweep across PGLib networks.
#
# Each entry defines a PGLib case to evaluate.
# The experiment script iterates over these cases, computes both DC and AC
# radii in a single call (shared base point), and writes per-case JSON
# results to experiments/output/pglib_sweep/.

cases:
  - name: pglib_opf_case5_pjm
    file: pglib_opf_case5_pjm.m

  - name: pglib_opf_case14_ieee
    file: pglib_opf_case14_ieee.m

  - name: pglib_opf_case30_ieee
    file: pglib_opf_case30_ieee.m

  - name: pglib_opf_case57_ieee
    file: pglib_opf_case57_ieee.m

  - name: pglib_opf_case118_ieee
    file: pglib_opf_case118_ieee.m

  - name: pglib_opf_case300_ieee
    file: pglib_opf_case300_ieee.m

  - name: pglib_opf_case1354_pegase
    file: pglib_opf_case1354_pegase.m

  - name: pglib_opf_case2869_pegase
    file: pglib_opf_case2869_pegase.m

# Shared compute parameters (applied to every case).
compute:
  base_dispatch: case       # "case" | "dc_opf"  —  use case PF as stable base point

  # OPF→DC consistency tolerance (MW).
  # IEEE cases match to machine precision (~1e-13 MW) with the tap-absorbed
  # DC convention.  PEGASE networks with hundreds of transformers may show
  # small residuals (~1-2 MW) due to LP solver vs LU precision differences.
  consistency_tol_mw: 5.0

  dc:
    mode: materialize
    chunk_size: 64
    dtype: float64
    inj_std_mw: 10.0
  ac:
    chunk_size: 64
    balance: true
    pf_init: flat
    pf_solver: pandapower
    lossless: true
  opf:
    headroom_factor: 0.95    # 95% headroom → ≥5% margin on every line

allow_download: true
data_dir: data/input
output_dir: experiments/output/pglib_sweep
