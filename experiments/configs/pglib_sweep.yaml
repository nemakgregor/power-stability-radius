# Experiment 1 config: DC vs AC radius sweep across PGLib networks.
#
# Each entry defines a PGLib case to evaluate.
# The experiment script iterates over these cases, computes both DC and AC
# radii in a single call (shared base point), and writes per-case JSON
# results to experiments/output/pglib_sweep/.
#
# Cases are grouped by source:
#   IEEE PF   — classic IEEE power flow cases (TL-Stat thermal limits)
#   IEEE RTS  — IEEE Reliability Test System (original thermal limits)
#   ACTIVSg   — Texas A&M synthetic grids (original thermal limits)
#   RTE       — French transmission grid snapshots (original thermal limits)
#   SDET      — synthetic distribution-equivalent test cases
#   Polish    — Polish power system snapshots (original thermal limits)
#   PEGASE    — pan-European network models (TL-UB thermal limits, problematic)
#
# Note: GOC (Grid Optimization Competition) cases are included but may exhibit
# DC OPF infeasibility due to tight structural constraints.  pandapower's
# distributed_slack mode is disabled for these cases (realloc corruption bug).

cases:
  # ── IEEE PF cases (TL-Stat thermal limits) ──────────────────────────
  - name: pglib_opf_case5_pjm
    file: pglib_opf_case5_pjm.m

  - name: pglib_opf_case14_ieee
    file: pglib_opf_case14_ieee.m

  - name: pglib_opf_case24_ieee_rts
    file: pglib_opf_case24_ieee_rts.m

  - name: pglib_opf_case30_ieee
    file: pglib_opf_case30_ieee.m

  - name: pglib_opf_case57_ieee
    file: pglib_opf_case57_ieee.m

  - name: pglib_opf_case73_ieee_rts
    file: pglib_opf_case73_ieee_rts.m

  - name: pglib_opf_case118_ieee
    file: pglib_opf_case118_ieee.m

  # ── ACTIVSg case (original thermal limits) ──────────────────────────
  - name: pglib_opf_case200_activ
    file: pglib_opf_case200_activ.m

  - name: pglib_opf_case2000_goc
    file: pglib_opf_case2000_goc.m
    ac:
      distributed_slack: false  # pandapower crashes (realloc corruption) with distributed_slack on this case
      pf_init: flat

  - name: pglib_opf_case10000_goc
    file: pglib_opf_case10000_goc.m
    base_dispatch: dc_opf          # ac_fpf hangs on 10k-bus network; use DC OPF instead
    timeout: 900                   # 15 min for 10k-bus network (global default is 600s)
    ac:
      distributed_slack: false  # pandapower crashes (realloc corruption) with distributed_slack on this case
      pf_init: flat

  # ── SDET / RTE cases (medium to large scale) ───────────────────────
  - name: pglib_opf_case588_sdet
    file: pglib_opf_case588_sdet.m

  - name: pglib_opf_case1888_rte
    file: pglib_opf_case1888_rte.m

  - name: pglib_opf_case1951_rte
    file: pglib_opf_case1951_rte.m

  - name: pglib_opf_case2853_sdet
    file: pglib_opf_case2853_sdet.m

  - name: pglib_opf_case6468_rte
    file: pglib_opf_case6468_rte.m
    headroom_factor: 0.98
    ac:
      distributed_slack: false  # pandapower crashes (realloc corruption) with distributed_slack on this case
      pf_init: flat             # flat init avoids dc-init interaction with 129 trafos
    # NOTE: DC OPF may be infeasible at any headroom due to tight thermal limits
    # and generator min-output constraints in the RTE network topology.
    # When infeasible, the case is tracked in summary.json with status=dc_opf_infeasible.

  - name: pglib_opf_case6515_rte
    file: pglib_opf_case6515_rte.m
    headroom_factor: 0.98
    ac:
      distributed_slack: false  # pandapower crashes (realloc corruption) with distributed_slack on this case
      pf_init: flat             # flat init avoids dc-init interaction with 129 trafos
    # NOTE: DC OPF may be infeasible at any headroom due to tight thermal limits
    # and generator min-output constraints in the RTE network topology.
    # When infeasible, the case is tracked in summary.json with status=dc_opf_infeasible.

  # ── Polish cases (original thermal limits) ──────────────────────────
  - name: pglib_opf_case2383wp_k
    file: pglib_opf_case2383wp_k.m
    headroom_factor: 0.98     # tight topology; 0.95 infeasible, 1.0 gives zero DC radius
    ac:
      distributed_slack: false  # pandapower crashes (realloc corruption) with distributed_slack on this case
      pf_init: flat             # flat init avoids dc-init interaction with 129 trafos

  - name: pglib_opf_case2736sp_k
    file: pglib_opf_case2736sp_k.m         # flat init avoids dc-init interaction with 129 trafos

  # ── Problematic cases (TL-UB / tight topology) ─────────────────────
  - name: pglib_opf_case300_ieee
    file: pglib_opf_case300_ieee.m
    headroom_factor: 0.98     # tight topology; 0.95 infeasible, 1.0 gives zero DC radius
    ac:
      distributed_slack: false  # pandapower crashes (realloc corruption) with distributed_slack on this case
      pf_init: flat             # flat init avoids dc-init interaction with 129 trafos

  - name: pglib_opf_case1354_pegase
    file: pglib_opf_case1354_pegase.m
    headroom_factor: 0.95     # OPF infeasible below 0.95; AC margins may be negative
    ac:
      distributed_slack: false  # pandapower crashes (realloc corruption) with distributed_slack on large PEGASE cases
      pf_init: flat             # flat init for stability with many trafos

  - name: pglib_opf_case2869_pegase
    file: pglib_opf_case2869_pegase.m
    headroom_factor: 0.95     # OPF infeasible below 0.95; AC PF convergence is the barrier
    ac:
      distributed_slack: false  # pandapower crashes (realloc corruption) with distributed_slack on large PEGASE cases
      pf_init: flat             # flat init for stability with 531 trafos

# Shared compute parameters (applied to every case).
compute:
  base_dispatch: ac_fpf     # "case" | "dc_opf" | "acpf" | "ac_fpf"

  # OPF→DC consistency tolerance (MW).
  # IEEE cases match to machine precision (~1e-13 MW) with the tap-absorbed
  # DC convention.  PEGASE networks with hundreds of transformers may show
  # small residuals (~1-2 MW) due to LP solver vs LU precision differences.
  # case300_ieee with phase-shifting transformers shows ~32 MW deviation.
  consistency_tol_mw: 50.0

  dc:
    mode: materialize
    chunk_size: 64
    dtype: float64
    inj_std_mw: 10.0
  ac:
    chunk_size: 64
    balance: true
    pf_init: dc                # DC warmstart for better convergence
    pf_solver: pandapower
    lossless: false            # lossy AC PF (r ≠ 0) for realistic base point
    distributed_slack: true    # distribute losses ∝ headroom (Pmax − Pset)
    trafo_model: pi            # π-model for transformers (convergence)
  ac_fpf:
    pg0_source: case           # initial dispatch guess: "case" | "midpoint"
    vm_min_pu: 0.9
    vm_max_pu: 1.1
  opf:
    headroom_factor: 0.90    # 90% headroom → ≥10% margin on every constrained line

allow_download: true
data_dir: data/input
output_dir: experiments/output/test_run_2
case_timeout_sec: 600    # per-case subprocess timeout (seconds); 0 = no timeout
