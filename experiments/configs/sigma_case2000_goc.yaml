# Sigma-radius experiment: pglib_opf_case2000_goc (2000 buses, 2743 lines)
#
# Uses synthetic sigma (10% of bus loads) since UC.jl data is not available
# for this network.

case:
  name: case2000_goc
  matpower_file: pglib_opf_case2000_goc.m
  slack_bus: 0

sigma_source: synthetic

synthetic_sigma:
  fraction: 0.10        # sigma_P = 10% of |P_load| per bus
  power_factor: 0.9     # for sigma_Q estimation on zero-Q-load buses

compute:
  ac:
    chunk_size: 64
    balance: true
    lossless: true
    fpf:
      pg0_source: midpoint
      vm_min_pu: 0.8
      vm_max_pu: 1.1
      max_iteration: 300
      max_loading_percent: 99.0
      init: dc
      max_attempts: 3
      per_attempt_timeout: 240

verification:
  top_k: 0
  scales: [0.5, 1.0, 1.5]

monte_carlo:
  enabled: false
  n_samples: 1000
  seed: 42
  tightened_limit:
    enabled: false
    target_r_sigma: 2.0
    n_samples: 1000

plot:
  top_k_critical: 5
  figsize: [20, 16]
  dpi: 200
  scatter_dpi: 300
  heatmap_dpi: 300

allow_download: true
data_dir: data/input
artifacts_root: run_artifacts
output_dir: sigma_case2000_goc
